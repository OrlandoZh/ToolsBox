<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8"/>
    <title>Annotation Manager</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 16px;
            background: #fafafa;
        }
        #search-box {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        #annotation-list {
            max-height: 600px;
            overflow-y: auto;
        }
        .annotation-item {
            background: white;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
            cursor: pointer;
        }
        .annotation-item:hover {
            background: #f5f5f5;
        }
        .annotation-text {
            font-size: 14px;
            color: #333;
            margin-bottom: 4px;
        }
        .annotation-meta {
            font-size: 12px;
            color: #666;
        }
        .annotation-color {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 4px;
        }
        #filter-bar {
            margin-bottom: 12px;
            display: flex;
            gap: 8px;
        }
        button {
            padding: 6px 12px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #f0f0f0;
        }
        button.active {
            background: #e3f2fd;
            border-color: #2196f3;
        }
    </style>
</head>
<body>
    <h2>Annotation Manager</h2>
    
    <input type="text" id="search-box" placeholder="Search annotations..."/>
    
    <div id="filter-bar">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="highlight">Highlights</button>
        <button class="filter-btn" data-filter="note">Notes</button>
        <button class="filter-btn" data-filter="image">Images</button>
    </div>
    
    <div id="annotation-list">
        <!-- Annotations will be loaded here -->
    </div>
    
    <script>
        // Annotation Manager JavaScript
        const searchBox = document.getElementById('search-box');
        const annotationList = document.getElementById('annotation-list');
        const filterBtns = document.querySelectorAll('.filter-btn');
        
        let currentFilter = 'all';
        let annotations = [];
        
        // Load annotations from Zotero
        async function loadAnnotations() {
            // This will be called from the parent window
            if (window.arguments && window.arguments[0]) {
                annotations = window.arguments[0].annotations || [];
                renderAnnotations();
            }
        }
        
        // Filter annotations
        function filterAnnotations(filter) {
            currentFilter = filter;
            filterBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            renderAnnotations();
        }
        
        // Render annotations
        function renderAnnotations() {
            const searchTerm = searchBox.value.toLowerCase();
            
            const filtered = annotations.filter(ann => {
                const matchesFilter = currentFilter === 'all' || ann.type === currentFilter;
                const matchesSearch = ann.text.toLowerCase().includes(searchTerm);
                return matchesFilter && matchesSearch;
            });
            
            annotationList.innerHTML = '';
            filtered.forEach(ann => {
                const item = document.createElement('div');
                item.className = 'annotation-item';
                item.dataset.id = ann.id;
                
                const textDiv = document.createElement('div');
                textDiv.className = 'annotation-text';
                
                const colorSpan = document.createElement('span');
                colorSpan.className = 'annotation-color';
                colorSpan.style.background = ann.color || '#ffd700';
                textDiv.appendChild(colorSpan);
                
                const textSpan = document.createElement('span');
                textSpan.textContent = ann.text;
                textDiv.appendChild(textSpan);
                
                const metaDiv = document.createElement('div');
                metaDiv.className = 'annotation-meta';
                metaDiv.textContent = `Page ${ann.page} • ${ann.type}`;
                
                item.appendChild(textDiv);
                item.appendChild(metaDiv);
                annotationList.appendChild(item);
            });
        }
        
        // Event listeners
        searchBox.addEventListener('input', renderAnnotations);
        
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => filterAnnotations(btn.dataset.filter));
        });
        
        // Initialize
        loadAnnotations();
    </script>
</body>
</html>
